name: Publish Polaguard to PyPI

on:
  push:
    tags:
      - 'v*' # Triggers automatically whenever you push a version tag like v0.1.0

jobs:
  build-n-publish:
    name: Build and publish Python distro to PyPI
    runs-on: ubuntu-latest
    
    # Crucial for Trusted Publishing (OIDC tokens)
    permissions:
      id-token: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Build Tools
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build Package Artifacts
      run: python -m build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1